# Perfil "test": base de datos aislada y un log menos ruidoso para la salida de los tests.
spring:
  datasource:
    url: jdbc:h2:mem:@artifactId@-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
