spring.application.name=@artifactId@

# Todo es configurable por variables de entorno; los valores por defecto permiten
# arrancar sin ninguna infraestructura externa (H2 en memoria).
spring.datasource.url=${DB_URL:jdbc:h2:mem:@artifactId@;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# El esquema lo mantiene Flyway; Hibernate solo valida que las entidades encajen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO

# Los campos opcionales sin valor no se emiten: mantiene las respuestas de la API limpias.
spring.jackson.default-property-inclusion=non_null
