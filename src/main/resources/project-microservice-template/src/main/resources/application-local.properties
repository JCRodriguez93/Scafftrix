# Perfil "local": pensado para desarrollo en la maquina del desarrollador.
# Arranca con H2 en memoria y expone la consola de H2 para inspeccionar los datos.
spring.datasource.url=jdbc:h2:mem:@artifactId@-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.@packageName@=DEBUG
