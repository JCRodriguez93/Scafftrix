# Levanta el microservicio junto a su base de datos PostgreSQL:
#   mvn clean package
#   export POSTGRES_PASSWORD='...'   # la contraseña real, nunca en el repo
#   export DB_PASSWORD="$POSTGRES_PASSWORD"
#   docker compose up --build
#
# Sin esas dos variables compose se niega a arrancar: el proyecto generado no
# empaqueta ningun secreto ni ningun valor por defecto predecible.
services:

  postgres:
    image: postgres:16-alpine
    container_name: @artifactId@-db
    environment:
      POSTGRES_DB: @artifactId@
      POSTGRES_USER: @artifactId@
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD before starting}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U @artifactId@ -d @artifactId@"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: @artifactId@
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/@artifactId@
      DB_USERNAME: @artifactId@
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD before starting (same value as POSTGRES_PASSWORD)}
      DB_DRIVER: org.postgresql.Driver
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres-data:
