spring.application.name=@artifactId@

# Configuración de H2 en memoria
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Creación del esquema de la aplicación
spring.sql.init.schema-locations=classpath:schema-all.sql
spring.sql.init.mode=always

# Inicialización de tablas de Spring Batch en H2
spring.batch.jdbc.initialize-schema=always